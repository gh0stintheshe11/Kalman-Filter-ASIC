name: ci

on:
  push:
  pull_request:

jobs:
  rtl:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install simulators
        run: sudo apt-get update && sudo apt-get install -y iverilog verilator yosys
      - name: Python environment
        run: |
          python -m venv .venv
          .venv/bin/pip install -e ".[dev]"
      - name: Lint
        run: make lint
      - name: Model and RTL tests (Icarus)
        run: make test
