# LibreLane 3 configuration: kf_top hardened as a macro on IHP SG13G2
# (130 nm, 1.2 V core).  Run from the repository root:
#     make flow            (see Makefile; needs the LibreLane environment)
DESIGN_NAME: kf_top
VERILOG_FILES:
  - dir::../../rtl/kf_top.v
  - dir::../../rtl/kf_rom.v
  - dir::../../rtl/kf_regfile.v
  - dir::../../rtl/kf_booth.v
  - dir::../../rtl/kf_mul.v
  - dir::../../rtl/kf_dot.v
  - dir::../../rtl/kf_rcp.v
  - dir::../../rtl/kf_add.v
  - dir::../../rtl/kf_prefix.v
  - dir::kf_clkgate_ihp.v       # kf_clkgate -> sg13g2_lgcp_1 (replaces rtl/kf_clkgate.v)
  - dir::kf_rdport_ihp.v        # read-port AND-OR from cells (replaces rtl/kf_rdport.v)

# The IHP lists exclude the integrated clock gate from synthesis and P&R;
# these copies allow it so that kf_clkgate_ihp.v can instantiate it.
SYNTH_EXCLUDED_CELL_FILE: dir::synth_exclude.cells
PNR_EXCLUDED_CELL_FILE: dir::pnr_exclude.cells
LINTER_INCLUDE_PDK_MODELS: true

# ---- synthesis -------------------------------------------------------------
# The multipliers and adders are written out as structures (Booth, Wallace
# tree, Kogge-Stone; rtl/kf_mul.v, kf_prefix.v): synthesis keeps their
# logarithmic depth, where its own adders are Brent-Kung or ripple.
# ABC script with delay-driven mapping and buffering; of all strategies it
# gave the fastest routed result (DELAY 4 was larger and slower after P&R).
SYNTH_STRATEGY: AREA 3

# ---- timing ----------------------------------------------------------------
PNR_SDC_FILE: dir::kf_top.sdc
SIGNOFF_SDC_FILE: dir::kf_top.sdc
CLOCK_PORT: clk
CLOCK_PERIOD: 8.0             # ns, 125 MHz at the slow corner
# The write-back stage (35-bit sign-magnitude sum, saturation, fan-out to
# the register file, forwarding and the reciprocal unit) sets the period.
# Tighter targets do not pay off: at 7.5 ns timing repair over-buffered and
# the routed design ended near 7.95 ns; at 8.0 ns it closes with margin.
# Sign off setup, hold, max-slew and max-cap at every corner:
# slow 1.08 V/125 C, typical 1.20 V/25 C, fast 1.32 V/-40 C.
# (The IHP default only checks setup at the typical corner.)
TIMING_VIOLATION_CORNERS: ["*"]
MAX_SLEW_VIOLATION_CORNERS: ["*"]
MAX_CAP_VIOLATION_CORNERS: ["*"]
RUN_POST_GRT_RESIZER_TIMING: true
# Design repair (fanout, slew, capacitance) once more after global routing:
# timing repair inserts buffers late in the flow, and without this a few of
# them exceeded the library's fanout guideline of 8.
RUN_POST_GRT_DESIGN_REPAIR: true
# Repair fanout to the cell library's limit (8; the IHP default target is
# 10, which left a few nets with fanout 9 to 17).
MAX_FANOUT_CONSTRAINT: 8

# ---- clock tree ------------------------------------------------------------
# The IHP default builds every level of every tree, including the many
# small gated trees, from 16x buffers; 4x and 2x buffers cut clock power
# several-fold.  OpenROAD's latency balancing, which delays the ungated
# flip-flops to match the gated ones, is kept: without it, hold repair of
# the host-address -> addend path put delay cells into the read port that
# data_out shares.
CTS_ROOT_BUFFER: sg13g2_buf_4
CTS_CLK_BUFFERS: [sg13g2_buf_4, sg13g2_buf_2]

# ---- placement ---------------------------------------------------------------
# Before routing, estimate signal wires with the RC of Metal2/Metal3, where
# they are routed (LibreLane's default averages all routing layers,
# including the thick top metals, so placement-stage timing repair saw
# wires several times too fast), and place timing-driven.
SIGNAL_WIRE_RC_LAYERS: [Metal2, Metal3]
CLOCK_WIRE_RC_LAYERS: [Metal4, Metal5]
PL_TIMING_DRIVEN: true

# ---- floorplan -------------------------------------------------------------
FP_SIZING: relative
FP_CORE_UTIL: 45
PL_TARGET_DENSITY_PCT: 55
IO_PIN_ORDER_CFG: dir::pin_order.cfg
