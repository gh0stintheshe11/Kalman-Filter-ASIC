[project]
name = "kfasic"
version = "0.2.0"
description = "Tooling, golden model and tests for the Kalman filter ASIC"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["cocotb>=2.0,<3", "pytest>=8", "matplotlib>=3.8"]

[project.scripts]
kfasm = "kfasic.asm:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["kfasic"]

[tool.pytest.ini_options]
testpaths = ["tests", "tb"]
markers = [
    "slow: long regressions (deselect with -m 'not slow')",
]
